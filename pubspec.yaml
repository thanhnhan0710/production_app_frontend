name: production_app_frontend
description: Web App quản lý nội bộ (Enterprise ERP).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  
  # --- 1. UI & Localization ---
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9

  # --- 2. State Management ---
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # --- 3. Networking ---
  dio: ^5.4.0
  
  # --- 4. Navigation ---
  go_router: ^13.0.0

  # --- 5. Dependency Injection ---
  get_it: ^7.6.6
  injectable: ^2.3.2

  # --- 6. Data Modeling & Storage ---
  json_annotation: ^4.8.1 
  freezed_annotation: ^2.4.1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # --- 7. Utilities ---
  logger: ^2.0.2
  uuid: ^4.2.1
  http: ^1.2.0
  file_picker: ^10.3.10
  http_parser: ^4.1.2
  url_launcher: ^6.2.1
  excel: ^4.0.0
  path_provider: ^2.1.1
  share_plus: ^7.2.0
  universal_html: ^2.2.4
  dropdown_search: ^6.0.0
  mobile_scanner: ^5.1.0
  image_picker: ^1.0.7
  pdf: ^3.10.0
  printing: ^5.11.0
  open_file: ^3.3.2
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  web_socket_channel: ^3.0.3
  analyzer: ^6.4.1
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.0
  mocktail: ^1.0.0
  mocktail_image_network: ^1.0.0
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  freezed: ^2.4.6
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  generate: true

# =========================================================
# PHẦN QUAN TRỌNG NHẤT ĐỂ FIX LỖI BUILD DOCKER
# =========================================================
dependency_overrides:
  # Ép dùng đúng version bạn cần
  web_socket_channel: ^3.0.3
  analyzer: ^6.4.1
  
  # Ép các thư viện test tuân thủ theo Flutter SDK Stable
  # (Khớp với các lỗi "pinned version" trong log trước)
  test_api: 0.7.8
  matcher: 0.12.18
  test: any