# Worker processes auto giúp tối ưu hiệu năng theo số core CPU
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    # Tối ưu hóa gửi file
    sendfile on;
    keepalive_timeout 65;

    # =================================================================
    # SERVER 1: HTTP -> HTTPS REDIRECT
    # =================================================================
    server {
        listen 80;
        server_name localhost;
        # Tự động chuyển hướng mọi truy cập HTTP sang HTTPS
        return 301 https://$host$request_uri;
    }

    # =================================================================
    # SERVER 2: HTTPS (FRONTEND + PROXY BACKEND)
    # =================================================================
    server {
        listen 443 ssl;
        server_name localhost;

        # --- CẤU HÌNH SSL ---
        # (Đường dẫn này phải khớp với nơi bạn copy cert vào trong Dockerfile)
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Các cấu hình bảo mật SSL cơ bản (Khuyến nghị)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # --- CẤU HÌNH GZIP (Nén file để load nhanh hơn) ---
        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        root /usr/share/nginx/html;
        index index.html;

        # -------------------------------------------------------------
        # 1. FRONTEND FLUTTER (Static Files)
        # -------------------------------------------------------------
        location / {
            # Hỗ trợ Single Page Application (SPA) của Flutter
            # Nếu không tìm thấy file, trả về index.html để Flutter tự routing
            try_files $uri $uri/ /index.html;
        }

        # Cache cho các file tĩnh (ảnh, font, css...)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|ttf)$ {
            expires 6M;
            access_log off;
            add_header Cache-Control "public";
        }

        # -------------------------------------------------------------
        # 2. PROXY CHO WEBSOCKET (QUAN TRỌNG NHẤT CHO REALTIME)
        # -------------------------------------------------------------
        location /ws/ {
            # Chuyển tiếp request wss://...:8443/ws/ sang ws://...:8000/ws/
            # LƯU Ý: Thay IP này bằng IP máy tính của bạn (đảm bảo Backend đang chạy ở đó)
            proxy_pass http://192.168.0.175:8000;

            # Các header bắt buộc để nâng cấp kết nối HTTP lên WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            
            # Tăng timeout để không bị ngắt kết nối khi idle
            proxy_read_timeout 86400; 
        }

        # -------------------------------------------------------------
        # 3. PROXY CHO BACKEND API & SWAGGER (DOCS)
        # -------------------------------------------------------------
        
        # Để truy cập Swagger UI qua HTTPS: https://.../docs
        location /docs {
            proxy_pass http://192.168.0.175:8000/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # File cấu hình OpenAPI
        location /openapi.json {
            proxy_pass http://192.168.0.175:8000/openapi.json;
            proxy_set_header Host $host;
        }

        # Các API chính (Ví dụ: /api/v1/machines...)
        location /api/ {
            proxy_pass http://192.168.0.175:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # -------------------------------------------------------------
        # 4. PROXY CHO ẢNH UPLOAD (STATIC FILES CỦA BACKEND)
        # -------------------------------------------------------------
        # Backend mount folder uploads tại /static, ta cần proxy để xem ảnh qua HTTPS
        location /static/ {
            proxy_pass http://192.168.0.175:8000/static/;
        }

        # -------------------------------------------------------------
        # ERROR PAGES
        # -------------------------------------------------------------
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}